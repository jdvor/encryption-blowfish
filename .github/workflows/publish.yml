name: Publish to NuGet
on:
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Set executable permission for scripts
        shell: bash
        run: chmod u+x *.sh

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Create package
        shell: bash
        run: ./pack.sh -c

      - name: Publish package
        shell: bash
        run: ./publish.sh ${{ secrets.NUGET_APIKEY_BLOWFISH }}
