name: Tests
on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', '**.sh', '.github/workflows/*.yml']
  pull_request:
    branches: [main]
    paths-ignore: ['**.md', '**.sh', '.github/workflows/*.yml']

env:
  DOTNET_VERSION: '10.0.x'

permissions:
  checks: write
  pull-requests: write

jobs:
  test:
    name: test-${{matrix.os}}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore -v minimal --nologo

      - name: Build
        run: dotnet build -c Release -v minimal --no-restore --nologo -clp:NoSummary

      - name: Run tests
        run: dotnet test -c Release -v minimal --no-build --nologo --logger trx --results-directory ./artifacts/test-results --collect:"XPlat Code Coverage"

      - name: Publish test results
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: test results (${{ matrix.os }})
          path: ./artifacts/test-results/**/*.trx
          reporter: dotnet-trx
