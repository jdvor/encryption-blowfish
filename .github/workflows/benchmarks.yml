name: Benchmarks
on:
  workflow_dispatch:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare benchmarks
        run: dotnet publish bench/Encryption.Blowfish.Benchmarks/Encryption.Blowfish.Benchmarks.csproj -c Release -p:RunAnalyzers=False -o ./artifacts/bench -v minimal --nologo

      - name: Run benchmarks
        run: ./artifacts/bench/Encryption.Blowfish.Benchmarks -r net10.0 -m -e GitHub -a ./artifacts/bench -f '*'

      - name: Upload benchmark results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: ./artifacts/bench/results/*-report-github.md
          retention-days: 90
